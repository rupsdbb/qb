[package]
name = "qbm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Small-screen PWA front end for qBittorrent-nox"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
sha2 = "0.10"
subtle = "2"
tower-http = { version = "0.6", features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
